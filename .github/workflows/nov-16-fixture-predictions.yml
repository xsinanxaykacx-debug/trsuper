name: Z-Kahin Nov 16 fixture snapshot

on:
  push:
    branches:
      - analysis/2026-11-16-fixtures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated analysis branch
        uses: actions/checkout@v4
        with:
          ref: analysis/2026-11-16-fixtures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model runtime
        run: python -m pip install --upgrade pip && python -m pip install joblib numpy pandas scipy scikit-learn xgboost

      - name: Generate immutable pre-match predictions
        id: predict
        shell: bash
        run: |
          set +e
          python scripts/predict_2026_11_16_fixtures.py
          status=$?
          echo "prediction_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit prediction snapshot or team-resolution audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_tests/
          if ! git diff --cached --quiet; then
            git commit -m "Save Nov 16 Z-Kahin fixture prediction snapshot"
            git push origin HEAD:analysis/2026-11-16-fixtures
          else
            echo "No generated prediction or audit files to commit."
          fi

      - name: Fail if one or more teams could not be resolved
        if: steps.predict.outputs.prediction_status != '0'
        run: exit 1
