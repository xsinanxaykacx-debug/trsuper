name: Telegram bot tests

on:
  push:
    branches:
      - feat/telegram-prediction-bot
  pull_request:
    branches:
      - main

jobs:
  telegram-bot-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy pandas scikit-learn scipy xgboost pytest
      - name: Run Telegram bot unit tests
        run: python -m pytest -q tests/test_telegram_bot.py
