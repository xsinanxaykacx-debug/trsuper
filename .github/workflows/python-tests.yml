name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/epl-integration-v2"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install numpy pandas scipy pytest

      - name: Run test suite
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -v
